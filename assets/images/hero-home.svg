<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <!--
    Pentagon-graph constellation — echoes the site logo.
    Each unit has 5 outer nodes (pentagon) + 1 center node, connected as in the logo:
    all 5 pentagon edges + center→top, center→bottom-left, center→bottom-right.

    Main unit (r=130) center-right acts as the focal point; smaller satellite units
    at left and corners suggest a distributed network of intelligence.

    Vertex formula for unit centered at (cx,cy) with radius r, top vertex first:
      V0=(cx, cy-r)  V1=(cx+0.951r, cy-0.309r)  V2=(cx+0.588r, cy+0.809r)
      V3=(cx-0.588r, cy+0.809r)                  V4=(cx-0.951r, cy-0.309r)
      C =(cx, cy)
  -->

  <g opacity="0.42">
  <!-- ── SUBTLE BACKGROUND FLOW LINES ── -->
  <g stroke="white" stroke-width="0.5" opacity="0.07" fill="none">
    <path d="M 0 160 C 300 148, 600 168, 1200 152"/>
    <path d="M 0 240 C 300 256, 600 234, 1200 248"/>
  </g>
  <path d="M 0 200 C 200 192, 500 196, 830 200 C 980 202, 1100 198, 1200 200"
        stroke="#c4973e" stroke-width="0.6" opacity="0.18" fill="none"/>

  <!-- ── OUTER CIRCLE ECHO (logo's enclosing ring) ── -->
  <circle cx="830" cy="200" r="158" fill="none" stroke="white" stroke-width="0.8" opacity="0.1"/>

  <!-- ── UNIT 1: SMALL BOTTOM-LEFT (r=32, center=105,305) ── -->
  <!-- pentagon edges -->
  <g stroke="white" stroke-width="0.75" opacity="0.2" fill="none">
    <line x1="105" y1="273" x2="135" y2="295"/><!-- V0-V1 -->
    <line x1="135" y1="295" x2="124" y2="331"/><!-- V1-V2 -->
    <line x1="124" y1="331" x2="86"  y2="331"/><!-- V2-V3 -->
    <line x1="86"  y1="331" x2="75"  y2="295"/><!-- V3-V4 -->
    <line x1="75"  y1="295" x2="105" y2="273"/><!-- V4-V0 -->
  </g>
  <!-- center connections -->
  <g stroke="white" stroke-width="0.75" opacity="0.2" fill="none">
    <line x1="105" y1="305" x2="105" y2="273"/><!-- C-V0 -->
    <line x1="105" y1="305" x2="124" y2="331"/><!-- C-V2 -->
    <line x1="105" y1="305" x2="86"  y2="331"/><!-- C-V3 -->
  </g>
  <!-- nodes -->
  <g fill="white" opacity="0.28">
    <circle cx="105" cy="273" r="2.2"/>
    <circle cx="135" cy="295" r="2"/>
    <circle cx="124" cy="331" r="2"/>
    <circle cx="86"  cy="331" r="2"/>
    <circle cx="75"  cy="295" r="2"/>
    <circle cx="105" cy="305" r="3"/>
  </g>

  <!-- ── UNIT 2: MEDIUM LEFT (r=62, center=278,182) ── -->
  <!-- pentagon edges -->
  <g stroke="white" stroke-width="1" opacity="0.26" fill="none">
    <line x1="278" y1="120" x2="337" y2="163"/><!-- V0-V1 -->
    <line x1="337" y1="163" x2="314" y2="232"/><!-- V1-V2 -->
    <line x1="314" y1="232" x2="242" y2="232"/><!-- V2-V3 -->
    <line x1="242" y1="232" x2="219" y2="163"/><!-- V3-V4 -->
    <line x1="219" y1="163" x2="278" y2="120"/><!-- V4-V0 -->
  </g>
  <!-- center connections (logo signature: C→V0, C→V2, C→V3) -->
  <g stroke="white" stroke-width="1" opacity="0.26" fill="none">
    <line x1="278" y1="182" x2="278" y2="120"/>
    <line x1="278" y1="182" x2="314" y2="232"/>
    <line x1="278" y1="182" x2="242" y2="232"/>
  </g>
  <!-- nodes -->
  <g fill="white" opacity="0.42">
    <circle cx="278" cy="120" r="3.5"/>
    <circle cx="337" cy="163" r="3"/>
    <circle cx="314" cy="232" r="3"/>
    <circle cx="242" cy="232" r="3"/>
    <circle cx="219" cy="163" r="3"/>
  </g>
  <circle cx="278" cy="182" r="5" fill="#c4973e" opacity="0.72"/>

  <!-- ── UNIT 3: SMALL TOP-RIGHT (r=40, center=1052,95) ── -->
  <g stroke="white" stroke-width="0.75" opacity="0.2" fill="none">
    <line x1="1052" y1="55"  x2="1090" y2="83"/>
    <line x1="1090" y1="83"  x2="1075" y2="127"/>
    <line x1="1075" y1="127" x2="1029" y2="127"/>
    <line x1="1029" y1="127" x2="1014" y2="83"/>
    <line x1="1014" y1="83"  x2="1052" y2="55"/>
    <line x1="1052" y1="95"  x2="1052" y2="55"/>
    <line x1="1052" y1="95"  x2="1075" y2="127"/>
    <line x1="1052" y1="95"  x2="1029" y2="127"/>
  </g>
  <g fill="white" opacity="0.3">
    <circle cx="1052" cy="55"  r="2.5"/>
    <circle cx="1090" cy="83"  r="2.2"/>
    <circle cx="1075" cy="127" r="2.2"/>
    <circle cx="1029" cy="127" r="2.2"/>
    <circle cx="1014" cy="83"  r="2.2"/>
    <circle cx="1052" cy="95"  r="3.2"/>
  </g>

  <!-- ── UNIT 4: TINY BOTTOM-RIGHT (r=24, center=1128,282) ── -->
  <g stroke="white" stroke-width="0.6" opacity="0.17" fill="none">
    <line x1="1128" y1="258" x2="1151" y2="275"/>
    <line x1="1151" y1="275" x2="1142" y2="301"/>
    <line x1="1142" y1="301" x2="1114" y2="301"/>
    <line x1="1114" y1="301" x2="1105" y2="275"/>
    <line x1="1105" y1="275" x2="1128" y2="258"/>
    <line x1="1128" y1="282" x2="1128" y2="258"/>
    <line x1="1128" y1="282" x2="1142" y2="301"/>
    <line x1="1128" y1="282" x2="1114" y2="301"/>
  </g>
  <g fill="white" opacity="0.22">
    <circle cx="1128" cy="258" r="1.8"/>
    <circle cx="1151" cy="275" r="1.8"/>
    <circle cx="1142" cy="301" r="1.8"/>
    <circle cx="1114" cy="301" r="1.8"/>
    <circle cx="1105" cy="275" r="1.8"/>
    <circle cx="1128" cy="282" r="2.5"/>
  </g>

  <!-- ── INTER-UNIT CONNECTIONS ── -->
  <!-- white: satellite ↔ satellite -->
  <g stroke="white" stroke-width="0.6" opacity="0.16" fill="none">
    <line x1="124" y1="331" x2="242" y2="232"/><!-- unit1 V2 → unit2 V3 -->
    <line x1="954" y1="160" x2="1105" y2="275"/><!-- main V1 → tiny V4 -->
    <line x1="906" y1="305" x2="1114" y2="301"/><!-- main V2 → tiny V3 -->
    <line x1="830" y1="70"  x2="1052" y2="55"/><!-- main V0 → small TR V0 -->
    <line x1="1090" y1="83" x2="954"  y2="160"/><!-- small TR V1 → main V1 -->
  </g>
  <!-- gold: medium unit → main unit (primary data flow, left→right) -->
  <g stroke="#c4973e" stroke-width="1.6" opacity="0.48" fill="none">
    <line x1="337" y1="163" x2="706" y2="160"/><!-- medium V1 → main V4 -->
    <line x1="314" y1="232" x2="754" y2="305"/><!-- medium V2 → main V3 -->
  </g>

  <!-- Data packets flowing along gold path -->
  <g fill="#c4973e" opacity="0.7">
    <circle cx="430" cy="162" r="3.5"/>
    <circle cx="520" cy="162" r="3.5"/>
    <circle cx="610" cy="162" r="3.5"/>
  </g>
  <g fill="white" opacity="0.38">
    <circle cx="430" cy="246" r="2.5"/>
    <circle cx="510" cy="255" r="2.5"/>
    <circle cx="595" cy="267" r="2.5"/>
  </g>

  <!-- ── MAIN UNIT (r=130, center=830,200) — focal point ── -->
  <!--
    V0=(830,70)   V1=(954,160)   V2=(906,305)
    V3=(754,305)  V4=(706,160)   C =(830,200)
  -->
  <!-- White pentagon sides (non-logo-signature edges) -->
  <g stroke="white" stroke-width="1.6" opacity="0.3" fill="none">
    <line x1="830" y1="70"  x2="954" y2="160"/><!-- V0-V1 -->
    <line x1="954" y1="160" x2="906" y2="305"/><!-- V1-V2 -->
    <line x1="706" y1="160" x2="830" y2="70"/> <!-- V4-V0 -->
  </g>
  <!-- Gold logo-signature edges + center connections -->
  <g stroke="#c4973e" stroke-width="2.2" opacity="0.62" fill="none">
    <line x1="906" y1="305" x2="754" y2="305"/><!-- V2-V3  (bottom) -->
    <line x1="754" y1="305" x2="706" y2="160"/><!-- V3-V4 -->
    <line x1="830" y1="200" x2="830" y2="70"/> <!-- C-V0   (up) -->
    <line x1="830" y1="200" x2="906" y2="305"/><!-- C-V2 -->
    <line x1="830" y1="200" x2="754" y2="305"/><!-- C-V3 -->
  </g>
  <!-- Main unit nodes -->
  <circle cx="830" cy="70"  r="6"    fill="white"   opacity="0.62"/>
  <circle cx="954" cy="160" r="5.5"  fill="white"   opacity="0.52"/>
  <circle cx="906" cy="305" r="7"    fill="#c4973e" opacity="0.9"/>
  <circle cx="754" cy="305" r="7"    fill="#c4973e" opacity="0.9"/>
  <circle cx="706" cy="160" r="5.5"  fill="white"   opacity="0.52"/>
  <!-- Center node — largest, gold, prominent -->
  <circle cx="830" cy="200" r="10"   fill="#c4973e" opacity="1.0"/>
  <circle cx="830" cy="200" r="16"   fill="none"    stroke="#c4973e" stroke-width="1" opacity="0.22"/>

  </g>
</svg>
