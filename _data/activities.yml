    - Helm

- name: A RAG-based Document Q&A Agent on Azure
  description: >
    I built a system for a customer that needed to work with large volumes of invoices and contracts. The idea was: upload documents; extract, index and save information from documents; ask a question in plain language; prepare the context; get a direct answer with the source cited. The system was deployed on Azure.
  link: /doc-agent-azure/
  icon: fas fa-robot
  tech:
    - Retrieval Augmented Gen
    - AI Foundry
    - Azure
    
