- name: Time Series Forecasting — Continuous Ranked Probability Score (CRPS)
  description: >
    Many forecasting models treat over- and under-predictions the same. In practice the stakes
    often differ. I walk through parametric probabilistic models and introduce CRPS — a loss
    function designed for training them.
  link: /crps/
  icon: fas fa-fw fa-chart-line
  tech:
    - Time Series
    - CRPS
    - Loss Function

- name: Time Series Forecasting — Quantile Forecasting — Quantile Loss
  description: >
    Traditional forecasting treats over- and under-predictions equally, but real-world costs
    can differ significantly. Quantile forecasting addresses this by estimating confidence
    intervals, offering a nuanced view of uncertainty.
  link: /quantile-loss/
  icon: fas fa-fw fa-chart-bar
  tech:
    - Time Series
    - Quantile Regression
    - Quantile Loss
