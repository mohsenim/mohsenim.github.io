- name: Deploying to IONOS Managed Kubernetes - A Practical Walkthrough
  description: >
    I recently worked on deploying a project to IONOS Managed Kubernetes and documented the experience in a practical walkthrough. The Kubernetes concepts are familiar, but every cloud provider has its own ecosystem, tooling, networking defaults, and configuration details. This post covers the setup process, the IONOS-specific parts, and some of the lessons learned along the way.
  link: /ionos-managed-kubernetes/
